name = "blog-counter"
main = "src/index.js"
compatibility_date = "2024-01-01"
compatibility_flags = ["nodejs_compat"]

# 开发环境配置
[env.development]
name = "blog-counter-dev"

# 生产环境配置
[env.production]
name = "blog-counter-prod"

# KV 命名空间绑定
# 需要在 Cloudflare 控制台创建 KV 命名空间后填写 ID
kv_namespaces = [
  { binding = "COUNTER_KV", id = "adaa574b52614a2780b96cea377efaae", preview_id = "adaa574b52614a2780b96cea377efaae" }
]

# 路由配置（部署后配置）
# routes = [
#   { pattern = "your-domain.com/api/counter/*", zone_name = "your-domain.com" }
# ]
